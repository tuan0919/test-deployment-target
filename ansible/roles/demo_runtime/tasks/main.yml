- name: Validate required non-secret inputs
  ansible.builtin.assert:
    that:
      - registry_ca_cert_path is defined
      - postgres_password is defined
      - postgres_password | length > 0
      - cloudflare_tunnel_token_file is defined
      - lookup('ansible.builtin.file', cloudflare_tunnel_token_file) | trim | length > 0
    fail_msg: registry_ca_cert_path, postgres_password and cloudflare_tunnel_token_file must be supplied by Jenkins.
  no_log: true

- name: Install Docker and runtime prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - docker.io
      - docker-compose-v2
      - jq
      - postgresql-client
      - tar
    state: present
    update_cache: true

- name: Add deploy user to Docker group
  ansible.builtin.user:
    name: deploy
    groups: docker
    append: true

- name: Create APT keyring directory
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install Cloudflare package signing key
  ansible.builtin.get_url:
    url: https://pkg.cloudflare.com/cloudflare-main.gpg
    dest: /usr/share/keyrings/cloudflare-main.gpg
    owner: root
    group: root
    mode: '0644'

- name: Configure Cloudflare APT repository
  ansible.builtin.apt_repository:
    repo: deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main
    filename: cloudflared
    state: present
    update_cache: true

- name: Install cloudflared
  ansible.builtin.apt:
    name: cloudflared
    state: present

- name: Create cloudflared configuration directory
  ansible.builtin.file:
    path: /etc/cloudflared
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Install protected Cloudflare Tunnel token
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', cloudflare_tunnel_token_file) | trim }}\n"
    dest: /etc/cloudflared/tunnel-token
    owner: root
    group: root
    mode: '0600'
  no_log: true
  notify: Restart cloudflared

- name: Install cloudflared systemd service
  ansible.builtin.template:
    src: cloudflared.service.j2
    dest: /etc/systemd/system/cloudflared.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart cloudflared

- name: Enable and start cloudflared
  ansible.builtin.systemd_service:
    name: cloudflared
    enabled: true
    state: started
    daemon_reload: true

- name: Create runtime directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: deploy
    group: deploy
    mode: '0750'
  loop:
    - "{{ eac_runtime_root }}"
    - "{{ eac_runtime_root }}/app"
    - "{{ eac_runtime_root }}/persist"
    - "{{ eac_runtime_root }}/persist/predeploy"
    - "{{ eac_runtime_root }}/state"

- name: Set PostgreSQL data directory ownership for the container user
  ansible.builtin.file:
    path: "{{ eac_runtime_root }}/persist/postgres"
    state: directory
    owner: '70'
    group: '70'
    mode: '0700'

- name: Create Docker registry trust directory
  ansible.builtin.file:
    path: "/etc/docker/certs.d/{{ registry_host }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install registry CA in Docker trust store
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', registry_ca_cert_path) | regex_replace('(?m)^\\+-----BEGIN CERTIFICATE-----', '-----BEGIN CERTIFICATE-----') }}"
    dest: "/etc/docker/certs.d/{{ registry_host }}/ca.crt"
    owner: root
    group: root
    mode: '0644'
  notify: Restart Docker

- name: Install registry CA in the system trust store
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', registry_ca_cert_path) | regex_replace('(?m)^\\+-----BEGIN CERTIFICATE-----', '-----BEGIN CERTIFICATE-----') }}"
    dest: "/usr/local/share/ca-certificates/{{ registry_host | regex_replace(':', '-') }}.crt"
    owner: root
    group: root
    mode: '0644'
  notify: Update system CA certificates

- name: Download Kopia archive
  ansible.builtin.get_url:
    url: "{{ kopia_archive_url }}"
    dest: "/tmp/kopia-{{ kopia_version }}.tar.gz"
    mode: '0644'

- name: Install Kopia binary
  ansible.builtin.unarchive:
    src: "/tmp/kopia-{{ kopia_version }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    extra_opts: ["--strip-components=1"]
    creates: /usr/local/bin/kopia

- name: Install application Compose definition
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ eac_runtime_root }}/app/docker-compose.yml"
    owner: deploy
    group: deploy
    mode: '0640'

- name: Check whether a deployment image is already recorded
  ansible.builtin.stat:
    path: "{{ eac_runtime_root }}/state/current-image"
  register: current_image_state

- name: Read the currently deployed immutable image
  ansible.builtin.slurp:
    src: "{{ eac_runtime_root }}/state/current-image"
  register: current_image_file
  when: current_image_state.stat.exists

- name: Preserve the current deployment image in runtime configuration
  ansible.builtin.set_fact:
    current_image_ref: "{{ (current_image_file.content | b64decode | trim) if current_image_state.stat.exists else '' }}"

- name: Install protected runtime environment
  ansible.builtin.template:
    src: runtime.env.j2
    dest: "{{ eac_runtime_root }}/app/runtime.env"
    owner: deploy
    group: deploy
    mode: '0600'
  no_log: true

- name: Restart Docker
  ansible.builtin.service:
    name: docker
    state: restarted

- name: Update system CA certificates
  ansible.builtin.command: update-ca-certificates
  changed_when: true
  notify: Restart Docker

- name: Restart cloudflared
  ansible.builtin.systemd_service:
    name: cloudflared
    state: restarted
    daemon_reload: true
